analysis:

  name: Fixed Wing Landing
  version: 1.0
  aircraft: ArduPlane

messages:
  - MODE
  - ARM
  - LAND
  - RFND
  - BARO
  - GPS
  - TECS
  - TEC2
  - TEC3
  - ARSP
  - ATT
  - AETR

parameter_groups:

  geometry:
    - LAND_FLARE_ALT
    - LAND_FLARE_SEC
    - LAND_PF_ALT
    - LAND_SLOPE_RCALC

  speed:
    - LAND_PF_ARSPD
    - AIRSPEED_CRUISE
    - AIRSPEED_MIN
    - AIRSPEED_STALL

  rangefinder:
    - RNGFND1_MAX
    - RNGFND1_MIN

  tecs:
    - TECS_SPDWEIGHT

metrics:
  - glide_slope
  - approach_speed
  - flare
  - touchdown

plots:
  - altitude
  - airspeed
  - throttle
  - landing_stage

derived_events:

  - landing_start
  - final_approach
  - flare
  - touchdown
  - rollout

parameter_file:

  required: false
  match: basename

rangefinder:

  zero_threshold: 0.05

  continuous_seconds: 1.0

  max_gap_ms: 100

barometer:

  altitude_field: Alt

  smoothing_samples: 25

  derivative_samples: 10

  descent_threshold: -0.30

  climb_threshold: 0.30

  level_threshold: 0.10
